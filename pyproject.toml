[project]
name = "capella-mcp"
version = "0.1.0"
description = "MCP server exposing read/write access to Capella (Arcadia/MBSE) models via python4capella"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "capellambse>=0.6.0",
    "filelock>=3.13.0",
]

[project.scripts]
capella-mcp = "capella_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capella_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires the built capella-mcp Docker image and a real Capella install",
]
